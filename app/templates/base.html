<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"422","swap":true},{"code":"[45]..","swap":false,"error":true}]}'>
  <title>{% block title %}Macro Log{% endblock %}</title>
  <link rel="stylesheet" href="{{ static_url('css/app.css') }}">
  <link rel="manifest" href="/manifest.webmanifest?v={{ asset_version() }}" crossorigin="use-credentials">
  <link rel="apple-touch-icon" href="{{ static_url('icons/apple-touch-icon.png') }}">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Macros">
  <script src="{{ static_url('vendor/htmx.min.js') }}" defer></script>
  <script src="{{ static_url('vendor/chart.umd.js') }}" defer></script>
  <script src="{{ static_url('js/app.js') }}" defer></script>
  <script src="{{ static_url('vendor/alpine.min.js') }}" defer></script>
</head>
<body hx-boost="true">
  <main class="page">{% block content %}{% endblock %}</main>
  {% block overlay %}{% endblock %}
  <div id="toast" class="toast-slot"></div>
  <nav class="bottom-nav" x-data>
    <a href="/" class="nav-item{{ ' active' if nav == 'today' }}">{{ icon("today") }}<span>Today</span></a>
    <a href="/history" class="nav-item{{ ' active' if nav == 'history' }}">{{ icon("history") }}<span>History</span></a>
    {% block log_button %}<a href="/?log=1" class="log-btn" aria-label="Log food">{{ icon("plus") }}</a>{% endblock %}
    <a href="/settings/foods" class="nav-item{{ ' active' if nav == 'foods' }}">{{ icon("foods") }}<span>Foods</span></a>
    <a href="/settings" class="nav-item{{ ' active' if nav == 'settings' }}">{{ icon("settings") }}<span>Settings</span></a>
  </nav>
</body>
</html>
