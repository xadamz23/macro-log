{% if errors.form %}<p class="error">{{ errors.form }}</p>{% endif %}
<div class="field{% if errors.name %} invalid{% endif %}">
  <label for="{{ prefix }}-name">Name</label>
  <input id="{{ prefix }}-name" type="text" name="name" maxlength="100" autocomplete="off" value="{{ values.get('name', '') }}">
  {% if errors.name %}<span class="error">{{ errors.name }}</span>{% endif %}
</div>
<div class="field{% if errors.serving_label %} invalid{% endif %}">
  <label for="{{ prefix }}-serving">Serving</label>
  <input id="{{ prefix }}-serving" type="text" name="serving_label" maxlength="50" placeholder="e.g. 1 cup, 170 g" value="{{ values.get('serving_label', '') }}">
  {% if errors.serving_label %}<span class="error">{{ errors.serving_label }}</span>{% endif %}
</div>
{% include "partials/macro_fields.html" %}
