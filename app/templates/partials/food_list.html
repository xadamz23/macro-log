<section id="food-list" class="card glass"{% if oob %} hx-swap-oob="true"{% endif %}>
  <h2>Your quick foods</h2>
  {% if foods %}
  <ul class="list">
    {% for food in foods %}
      {% include "partials/food_row.html" %}
    {% endfor %}
  </ul>
  {% else %}
  <p class="empty">No quick foods yet. Add one above, or flip "Save as quick food" when logging.</p>
  {% endif %}
</section>
