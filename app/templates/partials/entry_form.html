<form id="entry-form" class="card stack" hx-post="/entries" hx-swap="none" x-data="macroForm">
  <input type="hidden" name="day" value="{{ day_value }}">
  {% if errors.form %}<p class="error">{{ errors.form }}</p>{% endif %}
  <div class="field{% if errors.name %} invalid{% endif %}">
    <label for="entry-name">Name (optional)</label>
    <input id="entry-name" type="text" name="name" maxlength="100" autocomplete="off" value="{{ values.get('name', '') }}">
    {% if errors.name %}<span class="error">{{ errors.name }}</span>{% endif %}
  </div>
  {% include "partials/macro_fields.html" %}
  <div class="stack" x-data="{ save: {{ 'true' if values.get('save_quick') else 'false' }} }">
    <label class="toggle">
      <span>Save as quick food</span>
      <input type="checkbox" name="save_quick" value="on" x-model="save"{% if values.get('save_quick') %} checked{% endif %}>
      <span class="toggle-track" aria-hidden="true"></span>
    </label>
    <div class="field{% if errors.serving_label %} invalid{% endif %}" x-show="save" x-cloak>
      <label for="entry-serving">Serving label</label>
      <input id="entry-serving" type="text" name="serving_label" maxlength="50" placeholder="e.g. 1 cup, 170 g" value="{{ values.get('serving_label', '') }}">
      {% if errors.serving_label %}<span class="error">{{ errors.serving_label }}</span>{% endif %}
    </div>
  </div>
  <button class="btn btn-primary btn-block" type="submit">Log it</button>
</form>
