[project]
name = "macro-log"
version = "0.1.0"
description = "Personal macro tracker"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143",
    "uvicorn[standard]>=0.54",
    "jinja2>=3.1.6",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "pydantic-settings>=2.15",
    "psycopg[binary]>=3.3",
    "pyjwt[crypto]>=2.15",
    "python-multipart>=0.0.32",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
